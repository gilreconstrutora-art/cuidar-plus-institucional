<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Cuidar+</title><style>:root{--n:#102B4C;--b:#1E5A95;--p:#EAF2FA}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--p);font:16px system-ui;color:#203348}.box{width:min(420px,calc(100% - 32px));background:#fff;border-radius:18px;padding:32px;box-shadow:0 10px 35px #102b4c1a}.brand{font-size:2rem;font-weight:850;color:var(--n)}label{display:block;margin-top:18px;font-weight:700}input{width:100%;padding:13px;margin-top:7px;border:1px solid #cbd9e5;border-radius:9px;font-size:1rem}.btn{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:var(--b);color:#fff;font-weight:800;font-size:1rem}.error{background:#fff0f0;color:#a62d2d;padding:12px;border-radius:8px;margin-top:18px}.back{display:block;margin-top:20px;color:var(--b);text-align:center}</style></head><body><main class="box"><div class="brand">Cuidar+</div><p>Central gerencial</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Entrar na central</button></form><a class="back" href="/apresentacao/">Conhecer o Cuidar+</a></main></body></html>
